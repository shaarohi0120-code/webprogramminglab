<!DOCTYPE html>
<html>
<head>
  <title>HTML Text Formatting</title>
</head>
<body>

  <!-- Blockquote adds default left and right indentation -->
  <blockquote>
    The best way to predict the future is to create it.
  </blockquote>

  <!-- <q> automatically wraps the text in quotation marks -->
  <p>As he said, <q>Stay hungry, stay foolish.</q></p>

  <!-- <cite> italicizes the title of a creative work -->
  <p>Book: <cite>The Pragmatic Programmer</cite></p>

  <!-- <abbr> defines an abbreviation or acronym -->
  <p>W3C sets web standards.</p>

  <!-- <address> italicizes contact information and adds line breaks -->
  <address>
    Contact: Admin Office<br>
    College Road, Delhi
  </address>

  <!-- <del> adds a strikethrough; <ins> adds an underline -->
  <p><del>Old price 500</del> <ins>New price 400</ins></p>

</body>
</html>
