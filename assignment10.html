<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia Example</title>
</head>
<body>

    <h3>Image</h3>
    <img src="About ABES.webp"
        alt="College campus" 
         width="200" 
         height="200">

    <h3>Video</h3>
    <video width="320" height="240" controls>
        <source src="https://www.google.com/imgres?q=abes%20erp&imgurl=https%3A%2F%2Fwww.abes.ac.in%2Fassets%2FHomePage%2FAbout%2520ABES.webp&imgrefurl=https%3A%2F%2Fwww.abes.ac.in%2F&docid=SJde-AFTQKNWnM&tbnid=c5J_afYUCunxBM&vet=12ahUKEwjx3pGnx4SYAxVBR2wGHcdBEvsQnPAOegQIOxAA..i&w=580&h=460&hcb=2&ved=2ahUKEwjx3pGnx4SYAxVBR2wGHcdBEvsQnPAOegQIOxAA" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h3>Audio</h3>
    <audio controls>
        <source src="https://mozilla.net" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h3>YouTube</h3>
    <iframe width="400" 
            height="250" 
            src="https://youtube.com" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

</body>
</html>
