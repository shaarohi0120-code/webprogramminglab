<!DOCTYPE html>
<html>
    <head> 
  <style>
    /* Styling for block-level elements */
    .block-box {
      background-color: lightblue;
      margin-bottom: 5px;
      padding: 2px;
    }

    /* Styling for inline elements */
    .inline-box {
      background-color: lightgreen;
      padding: 2px;
    }
  </style>
</head>
<body>

  <!-- Block Elements (take full width and stack vertically) -->
  <div class="block-box">Block 1</div>
  <div class="block-box">Block 2</div>

  <!-- Inline Elements (fit content width and sit side-by-side) -->
  <span class="inline-box">Inline 1</span>
  <span class="inline-box">Inline 2</span>
  <span class="inline-box">Inline 3</span>

    </body>
</html>
