<!DOCTYPE html>
<html>
<head>
  <title>Links demo</title>
</head>
<body id="top">

  <p>Links demo</p>

  <a href="https://example.com">External link</a><br>
  <a href="#bottom">Jump to bottom</a><br>
  <a href="mailto:someone@example.com">Email us</a><br>
  
  <!-- Image link (ensure 'logo.png' exists in the correct folder to fix the broken icon) -->

    <img src="logo.png" alt="Logo" width="150" height="80">
  </a>

  <!-- Spacing to push the bottom section down -->
  <div style="height: 600px;"></div>

  <p id="bottom">
    Bottom. <a href="#top">Back to top</a>
  </p>

</body>
</html>
