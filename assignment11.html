<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Page</title>
  <style>
    /* Basic styling to match the layout while ensuring clear keyboard focus */
    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 20px;
    }
    nav {
      margin-bottom: 20px;
    }
    .banner-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }
    .banner-image {
      width: 300px;
      height: 24px;
      border: 1px solid #cccccc;
      display: block;
    }
    /* High-contrast focus ring for keyboard navigation */
    a:focus, button:focus, input:focus {
      outline: 3px solid #005fcc;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- 1. Skip link to bypass navigation -->
  <a href="#main-content">Skip to main content</a>

  <!-- 2. Semantic navigation landmark -->
  <nav aria-label="Primary Navigation">
    <a href="/">Home</a>
    <a href="/help">Help</a>
  </nav>

  <!-- 3. Main content landmark matching the skip link target -->
  <main id="main-content">
    <h1>Accessible Page</h1>

    <!-- 4. Image with descriptive alt text and accessible close button -->
    <div class="banner-group" role="region" aria-label="Notification banner">
      <img 
        src="banner.png" 
        alt="Promotional announcement banner" 
        class="banner-image"
      >
      <button type="button" aria-label="Close banner">X</button>
    </div>

    <!-- 5. Search form with explicitly linked label and input -->
    <form role="search" action="/search" method="get">
      <label for="search-input">Search:</label>
      <input type="search" id="search-input" name="q">
    </form>
  </main>

</body>
</html>
